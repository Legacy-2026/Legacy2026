<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0b0a" />
<title>LEGACY · Archivo Cifrado</title>
<style>
  :root{
    --paper:#eee7da;
    --gold:#a98b58;
    --muted:#8f877a;
    --dark:#0b0b0a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#0b0b0a;color:var(--paper)}
  body{
    display:flex;align-items:center;justify-content:center;padding:26px;
    background:
      radial-gradient(circle at 20% 15%,rgba(255,255,255,.035),transparent 24%),
      radial-gradient(circle at 80% 75%,rgba(255,255,255,.025),transparent 28%),
      #0b0b0a;
  }
  .shell{width:min(980px,100%);border:1px solid rgba(255,255,255,.13);background:#11110f;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.12);font:700 11px/1.2 Arial,sans-serif;letter-spacing:.18em;color:#8e887e}
  .brand{color:#f1eadf}
  .grid{display:grid;grid-template-columns:1.06fr .94fr;min-height:610px}
  .left{padding:52px 42px;border-right:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;justify-content:center}
  .right{padding:42px 34px;background:linear-gradient(180deg,#151411,#10100e);display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
  h1{font-size:clamp(44px,7vw,78px);line-height:.88;margin:14px 0 30px;letter-spacing:-.045em;font-weight:700}
  .museum-card{background:var(--paper);color:#171613;border:1px solid #aaa08e;box-shadow:inset 0 0 45px rgba(120,90,45,.08);padding:24px;position:relative}
  .museum-card:before,.museum-card:after{content:"";position:absolute;inset:10px;border:1px solid rgba(40,35,28,.20);pointer-events:none}
  .museum-card:after{inset:16px;border-color:rgba(40,35,28,.10)}
  .label{font:700 10px/1.2 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#5f594f;margin-bottom:9px}
  textarea{position:relative;z-index:1;width:100%;min-height:118px;resize:vertical;border:1px solid #7f7564;background:#f6f1e8;color:#1d1a16;padding:14px 15px;font:600 18px/1.45 "Courier New",monospace;outline:none}
  textarea:focus{border-color:#1d1a16;box-shadow:0 0 0 2px rgba(29,26,22,.10)}
  .actions{position:relative;z-index:1;display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{appearance:none;border:1px solid #25231e;background:#1b1a17;color:#f4eee3;padding:13px 18px;font:700 11px/1 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.18s}
  button:hover{transform:translateY(-1px);background:#26231e}
  button.secondary{background:transparent;color:#2c2923}
  button.secondary:hover{background:#ded4c2}
  .result{position:relative;z-index:1;margin-top:22px;border-top:1px solid #8c8375;padding-top:20px}
  .result-value{font-size:30px;font-weight:700;letter-spacing:.02em;min-height:40px;word-break:break-word}
  .result-value.reveal{animation:reveal .45s ease}
  @keyframes reveal{0%{filter:blur(8px);opacity:.15;transform:translateY(4px)}100%{filter:blur(0);opacity:1;transform:none}}
  .hint{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12)}
  .hint p{margin:9px 0 0;color:#c2b8a8;font-size:17px;line-height:1.5;font-style:italic}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
  .key{aspect-ratio:1.18/1;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;background:#171613;box-shadow:inset 0 -8px 20px rgba(0,0,0,.23)}
  .letters{font:700 13px/1 Arial,sans-serif;letter-spacing:.22em;color:#d2c8b8;text-align:center;padding-left:.22em}
  .key.special .letters{color:#b89a67;font-size:16px}
  .key.space .letters{font-size:10px;color:#9e9588}
  .seal{width:86px;height:86px;border:1px solid #8b7654;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;position:relative;color:#b79a67;font:700 10px/1.2 Arial,sans-serif;letter-spacing:.14em;text-align:center}
  .seal:before{content:"";position:absolute;inset:7px;border:1px solid #6f6047;border-radius:50%}
  .footer{display:flex;justify-content:space-between;gap:14px;padding:14px 22px;border-top:1px solid rgba(255,255,255,.10);font:10px/1.4 Arial,sans-serif;letter-spacing:.16em;color:#6e6960;text-transform:uppercase}
  .status{color:#b59866}
  @media(max-width:780px){
    body{padding:12px;align-items:flex-start}
    .grid{grid-template-columns:1fr}
    .left{border-right:0;border-bottom:1px solid rgba(255,255,255,.10);padding:34px 22px}
    .right{padding:30px 22px}
    h1{font-size:56px}
    .topbar,.footer{padding-left:14px;padding-right:14px}
    .footer{flex-direction:column}
  }
  @media(max-width:420px){
    h1{font-size:46px}
    .museum-card{padding:18px}
    textarea{font-size:16px}
    .letters{font-size:11px}
    button{width:100%}
  }
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="brand">LEGACY · SAFARI 2026</div>
    <div>ARCHIVO CIFRADO 01</div>
  </div>

  <section class="grid">
    <div class="left">
      <div class="eyebrow">Museo de pistas · acceso restringido</div>
      <h1>DESCIFRÁ<br>EL DESTINO.</h1>

      <div class="museum-card">
        <div class="label">Mensaje cifrado</div>
        <textarea id="cipher" spellcheck="false" autocomplete="off">77 88 2 777 8 444 33 777 / 555 2 7777 / 6 2 777 444 2 7777</textarea>

        <div class="actions">
          <button id="decodeBtn" type="button">Descifrar archivo</button>
          <button class="secondary" id="clearBtn" type="button">Limpiar</button>
        </div>

        <div class="result">
          <div class="label">Resultado</div>
          <div class="result-value" id="result">—</div>
        </div>
      </div>

      <div class="hint">
        <div class="eyebrow">Pista</div>
        <p>“No todo teclado tuvo una pantalla.”</p>
      </div>
    </div>

    <aside class="right">
      <div class="seal">MUSEUM<br>LEGACY<br>2026</div>
      <div class="keypad" aria-label="Clave visual">
        <div class="key special"><div class="letters">Ñ</div></div>
        <div class="key"><div class="letters">ABC</div></div>
        <div class="key"><div class="letters">DEF</div></div>

        <div class="key"><div class="letters">GHI</div></div>
        <div class="key"><div class="letters">JKL</div></div>
        <div class="key"><div class="letters">MNO</div></div>

        <div class="key"><div class="letters">PQRS</div></div>
        <div class="key"><div class="letters">TUV</div></div>
        <div class="key"><div class="letters">WXYZ</div></div>

        <div class="key" aria-hidden="true"></div>
        <div class="key space"><div class="letters">ESPACIO</div></div>
        <div class="key" aria-hidden="true"></div>
      </div>
    </aside>
  </section>

  <div class="footer">
    <span>Documento reservado · Staff Legacy</span>
    <span class="status">Sistema activo</span>
  </div>
</main>

<script>
  const map = {
    "1":"Ñ",
    "2":"A","22":"B","222":"C",
    "3":"D","33":"E","333":"F",
    "4":"G","44":"H","444":"I",
    "5":"J","55":"K","555":"L",
    "6":"M","66":"N","666":"O",
    "7":"P","77":"Q","777":"R","7777":"S",
    "8":"T","88":"U","888":"V",
    "9":"W","99":"X","999":"Y","9999":"Z",
    "0":" "
  };

  const input = document.getElementById("cipher");
  const result = document.getElementById("result");

  function decode(text){
    return text
      .trim()
      .split(/\s+/)
      .map(token => token === "/" ? " " : (map[token] || "•"))
      .join("")
      .replace(/\s+/g," ")
      .trim();
  }

  function showResult(){
    result.classList.remove("reveal");
    void result.offsetWidth;
    result.textContent = decode(input.value) || "—";
    result.classList.add("reveal");
  }

  document.getElementById("decodeBtn").addEventListener("click", showResult);
  document.getElementById("clearBtn").addEventListener("click", () => {
    input.value = "";
    result.textContent = "—";
    input.focus();
  });

  input.addEventListener("keydown", event => {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") showResult();
  });
</script>
</body>
</html>
